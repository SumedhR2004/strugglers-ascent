<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA & Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b0000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Brand" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- SEO -->
    <title>THE BRAND: ASCENSION SYSTEM — Sacrifice Your Comfort</title>
    <meta name="description" content="A gamified personal growth tracker combining Solo Leveling stat mechanics with a Berserk dark, gritty visual aesthetic. Track coding, training, and discipline." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0a0a0a] text-[#e8e6e1] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[Brand SW] Registered:', reg.scope),
            (err) => console.warn('[Brand SW] Registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
